[project]
name = "nuclei-segmentation-backend"
version = "1.0.0"
description = "FastAPI + ONNX Runtime backend for automated nuclei segmentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.18",
    "onnxruntime==1.20.1",
    "Pillow==11.1.0",
    "numpy==1.26.4",
    "scipy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

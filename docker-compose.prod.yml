# Production compose — frontend exposed on localhost:3001 for system nginx
# Usage on VM: docker compose -f docker-compose.prod.yml up -d
# Build:       docker compose -f docker-compose.prod.yml build --pull

services:
  backend:
    build: ./backend
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/samples:/app/samples:ro
    environment:
      - MODEL_PATH=/app/models/unet_nuclei.onnx
      - CORS_ORIGINS=https://nuclei.biratcodes.dev
      - ORT_THREADS=1
    mem_limit: 512m
    cpus: '1.0'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    mem_limit: 256m
    cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
